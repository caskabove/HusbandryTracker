<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Husbandry Tracker Control Panel - Edit Animal</title>
    <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
    <header class="page-header">
        <img src="/static/images/logo.png" alt="CaskAbove Chameleons" class="header-logo">
        <h1>Edit Animal</h1>
        {% set nav_current = "control" %}{% include "_nav.html" %}
    </header>

    <main class="admin-main">
        <section class="admin-card">
            <h2>{{ animal.name }}</h2>
            <form method="post" action="/admin/animals/{{ animal.id }}/update" class="admin-form">
                <label>Enclosure
                    <select name="enclosure_id">
                        {% for e in enclosures %}
                        <option value="{{ e.id }}" {% if e.id == animal.enclosure_id %}selected{% endif %}>{{ e.name }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label>Name <input type="text" name="name" value="{{ animal.name }}" required></label>
                <label>Common species <input type="text" name="common" value="{{ animal.species_common or '' }}"></label>
                <label>Scientific name <input type="text" name="scientific" value="{{ animal.species_scientific or '' }}"></label>
                <label>DOB <input type="text" name="dob" value="{{ animal.dob or '' }}" placeholder="YYYY-MM-DD or YYYY-MM"></label>
                <button type="submit">Save</button>
            </form>
        </section>
    </main>
</body>
</html>
