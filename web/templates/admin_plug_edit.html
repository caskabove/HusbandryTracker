<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerpMonitor Admin - Edit Plug</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="page-header">
        <h1>Edit Plug</h1>
        <nav><a href="/admin">All Enclosures</a> · <a href="/">Dashboard</a> · <a href="/guide">Guide</a></nav>
    </header>

    <main class="admin-main">
        {% if error %}<p class="error-banner">{{ error }}</p>{% endif %}
        <section class="admin-card">
            <h2>{{ plug.label }}</h2>
            <form method="post" action="/admin/plugs/{{ plug.id }}/update" class="admin-form">
                <label>Enclosure
                    <select name="enclosure_id">
                        {% for e in enclosures %}
                        <option value="{{ e.id }}" {% if e.id == plug.enclosure_id %}selected{% endif %}>{{ e.name }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label>Label <input type="text" name="label" value="{{ plug.label }}" required></label>
                <label>Purpose
                    <input type="text" name="purpose" value="{{ plug.purpose }}" list="purpose-options" required>
                    <datalist id="purpose-options">
                        <option value="light">
                        <option value="heat">
                        <option value="cooling">
                        <option value="UVB">
                        <option value="pump">
                    </datalist>
                </label>
                <label>Tracking Mode
                    <select name="tracking_mode" onchange="onTrackingModeChange(this, 'edit-plug-smart', 'edit-plug-manual')">
                        <option value="smart" {% if plug.tracking_mode == "smart" %}selected{% endif %}>Smart (Tuya-controlled)</option>
                        <option value="manual" {% if plug.tracking_mode == "manual" %}selected{% endif %}>Manual (hand-switched, e.g. a timer)</option>
                    </select>
                </label>
                <div id="edit-plug-smart" class="mode-fields" {% if plug.tracking_mode != "smart" %}style="display:none"{% endif %}>
                    <label>Tuya device_id <input type="text" name="tuya_device_id" value="{{ plug.tuya_device_id or '' }}" {% if plug.tracking_mode != "smart" %}disabled{% endif %}></label>
                    <label>Tuya local_key <input type="text" name="tuya_local_key" value="{{ plug.tuya_local_key or '' }}" {% if plug.tracking_mode != "smart" %}disabled{% endif %}></label>
                    <label>Outlet / DPS key <input type="text" name="switch_dps_key" value="{{ plug.switch_dps_key }}" style="width:3em" {% if plug.tracking_mode != "smart" %}disabled{% endif %}></label>
                    <label>LAN IP (optional) <input type="text" name="tuya_ip_address" value="{{ plug.tuya_ip_address or '' }}" placeholder="leave blank for auto-discovery" {% if plug.tracking_mode != "smart" %}disabled{% endif %}></label>
                </div>
                <div id="edit-plug-manual" class="mode-fields" {% if plug.tracking_mode != "manual" %}style="display:none"{% endif %}>
                    <label>Declared on-time <input type="time" name="declared_on_time" value="{{ plug.declared_on_time or '' }}" {% if plug.tracking_mode != "manual" %}disabled{% endif %}></label>
                    <label>Declared off-time <input type="time" name="declared_off_time" value="{{ plug.declared_off_time or '' }}" {% if plug.tracking_mode != "manual" %}disabled{% endif %}></label>
                </div>
                <button type="submit">Save</button>
            </form>
        </section>
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
